<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Logistics Pro - Inventario Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --shelf-color: #1e272e;
            --box-width: 58px; --box-height: 42px;
            --bg-a: #2196f3; --bg-b: #f44336; --bg-c: #4caf50; --bg-d: #ff9800;
            --bg-e: #9c27b0; --bg-f: #e91e63; --bg-g: #00bcd4; --bg-h: #607d8b;
            --check-color: #27ae60;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: #cbd5e0; margin: 0; padding: 0; }
        
        .controls { 
            background: white; padding: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            display: flex; gap: 8px; align-items: center; position: sticky; 
            top: 0; width: 100%; z-index: 2000; box-sizing: border-box; 
            flex-wrap: wrap; justify-content: center;
        }

        select, input, button { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }

        #warehouse { display: flex; gap: 30px; padding: 30px; overflow-x: auto; align-items: flex-start; }

        .rack { 
            background: #e2e8f0; border: 8px solid var(--shelf-color); 
            border-radius: 4px; width: 560px; flex-shrink: 0; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .rack-title { background: var(--shelf-color); color: white; text-align: center; padding: 10px; font-weight: 800; }

        .shelf { display: flex; flex-direction: column-reverse; background: #f8fafc; border-bottom: 2px solid #cbd5e0; }

        .box-grid { 
            display: flex; flex-wrap: wrap-reverse; gap: 6px; padding: 15px 10px;
            min-height: 50px; align-content: flex-start;
        }

        .shelf-title { font-size: 11px; font-weight: 800; color: white; text-align: center; padding: 6px; }
        
        /* Colores de base */
        .shelf-node-A .shelf-title { background-color: var(--bg-a); }
        .shelf-node-B .shelf-title { background-color: var(--bg-b); }
        .shelf-node-C .shelf-title { background-color: var(--bg-c); }
        .shelf-node-D .shelf-title { background-color: var(--bg-d); }
        .shelf-node-E .shelf-title { background-color: var(--bg-e); }
        .shelf-node-F .shelf-title { background-color: var(--bg-f); }
        .shelf-node-G .shelf-title { background-color: var(--bg-g); }
        .shelf-node-H .shelf-title { background-color: var(--bg-h); }

        /* CAJA Y TOOLTIP */
        .box { 
            width: var(--box-width); height: var(--box-height); border-radius: 3px; 
            border: 1px solid #8d6e63; background: linear-gradient(135deg, #d2b48c 0%, #c19a6b 100%);
            display: flex; align-items: center; justify-content: center; position: relative; cursor: grab;
        }
        .box:active { cursor: grabbing; transform: scale(1.1); z-index: 100; }
        .box-label { font-size: 11px; font-weight: 900; color: #3e2723; pointer-events: none; }

        .tooltip { 
            visibility: hidden; width: 140px; background: #1a1a1a; color: #fff; padding: 8px;
            border-radius: 6px; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            z-index: 9999; font-size: 10px; pointer-events: none; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .tooltip b { color: #ff9800; display: block; margin-bottom: 3px; }
        .tooltip img { width: 100%; margin-top: 5px; background: white; border-radius: 4px; }
        .box:hover .tooltip { visibility: visible; }

        /* CHECKBOX */
        .audit-checkbox { position: absolute; top: 0; right: 0; width: 25px; height: 25px; cursor: pointer; opacity: 0; z-index: 20; }
        .audit-check-container {
            position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            background: var(--check-color); color: white; font-size: 9px;
            border-radius: 50%; border: 1.5px solid white; opacity: 0; z-index: 15; pointer-events: none;
        }
        .audit-checkbox:checked + .audit-check-container { opacity: 1; }

        #sync-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #2d3436; color: white; padding: 10px 20px; border-radius: 50px;
            font-size: 13px; display: none; align-items: center; gap: 10px; z-index: 5000;
        }
        .spinner { width: 14px; height: 14px; border: 2px solid #555; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="controls">
        <select id="filterRack" onchange="applyFilters()"><option value="all">Estantes</option></select>
        <select id="filterStatus" onchange="applyFilters()"><option value="all">Estados</option></select>
        <input type="text" id="searchId" placeholder="🔍 Buscar ID..." oninput="applyFilters()">
        <button onclick="location.reload()">🔄</button>
    </div>

    <div id="warehouse">Cargando almacén...</div>
    <div id="sync-toast"><div class="spinner"></div><span id="sync-text">Sincronizando...</span></div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQxmMtrLlKEH1uQUNmUvQxXUmFJQNQc46rwfOpKMNzJytrGDRxyMjo_S2DhQIDJmXTv1o6G2fvZQZgi/pub?gid=1046628345&single=true&output=csv';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOdOZcJUyonVOTuTDr33TyDohlfYj9z-2-hLs4VSEm-MwGei7mh6cAnbQu2ejchQ5B/exec';
        
        let inventoryData = [];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        async function init() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                let data = await response.text();
                const rows = data.replace(/'/g, "").split(/\r?\n/).filter(r => r.trim() !== "");
                const sep = rows[0].includes(';') ? ';' : ',';

                inventoryData = rows.slice(1).map(row => {
                    const c = row.split(sep).map(cell => cell.trim());
                    return { 
                        id: c[1] || "S/N", 
                        estado: c[3] || "N/A", 
                        bin: c[4] || "", 
                        precio: c[10] || "0", 
                        foto: c[13] || "" 
                    };
                }).filter(i => i.bin !== "");

                populateFilters();
                render();
            } catch (e) { console.error(e); }
        }

        function render() {
            const container = document.getElementById('warehouse');
            container.innerHTML = '';
            const rackNums = [...new Set(inventoryData.map(i => i.bin.match(/\d+/)?.[0]))].filter(Boolean).sort((a,b)=>a-b);
            const shelfLetters = ['H', 'G', 'F', 'E', 'D', 'C', 'B', 'A']; 

            rackNums.forEach(r => {
                const rackEl = document.createElement('div');
                rackEl.className = `rack rack-node-${r}`;
                rackEl.innerHTML = `<div class="rack-title">ESTANTE ${r}</div>`;

                shelfLetters.forEach(s => {
                    const shelfId = `${r}${s}`;
                    const shelfItems = inventoryData.filter(i => i.bin.toUpperCase() === shelfId);
                    const shelfEl = document.createElement('div');
                    shelfEl.className = `shelf shelf-node-${s}`;
                    const gridEl = document.createElement('div');
                    gridEl.className = "box-grid";
                    gridEl.dataset.shelf = shelfId;

                    shelfItems.forEach(item => {
                        const box = document.createElement('div');
                        box.className = 'box';
                        box.dataset.id = item.id.toLowerCase();
                        box.dataset.unique = item.id;
                        box.dataset.estado = item.estado;
                        box.innerHTML = `
                            <input type="checkbox" class="audit-checkbox">
                            <div class="audit-check-container">✓</div>
                            <div class="box-label">${item.id}</div>
                            <div class="tooltip">
                                <b>ID: ${item.id}</b>
                                <span>$${item.precio} — ${item.estado}</span>
                                ${item.foto ? `<img src="${item.foto}" alt="F">` : ''}
                            </div>
                        `;
                        
                        box.querySelector('.audit-checkbox').addEventListener('change', () => {
                            playBeep(880, 0.1); 
                            if(navigator.vibrate) navigator.vibrate(10);
                        });

                        gridEl.appendChild(box);
                    });

                    shelfEl.innerHTML = `<div class="shelf-title" data-base="Repisa ${s}">Repisa ${s}</div>`;
                    shelfEl.appendChild(gridEl);
                    rackEl.appendChild(shelfEl);
                });
                container.appendChild(rackEl);
            });

            initSortable();
            applyFilters();
        }

        function initSortable() {
            const toast = document.getElementById('sync-toast');
            document.querySelectorAll('.box-grid').forEach(grid => {
                new Sortable(grid, {
                    animation: 100, group: 'shared', filter: '.audit-checkbox',
                    onEnd: async function (evt) {
                        if (evt.from === evt.to && evt.oldIndex === evt.newIndex) return;
                        playBeep(440, 0.05);
                        
                        const boxId = evt.item.dataset.unique;
                        const newBin = evt.to.dataset.shelf;
                        toast.style.display = 'flex';
                        document.getElementById('sync-text').innerText = `Guardando ${boxId}...`;

                        try {
                            await fetch(APPS_SCRIPT_URL, {
                                method: 'POST', mode: 'no-cors',
                                body: JSON.stringify({ id: boxId, newBin: newBin })
                            });
                            document.getElementById('sync-text').innerText = "¡OK!";
                            applyFilters();
                            setTimeout(() => { toast.style.display = 'none'; }, 1000);
                        } catch (e) { console.error(e); }
                    }
                });
            });
        }

        function applyFilters() {
            const rackVal = document.getElementById('filterRack').value;
            const statusVal = document.getElementById('filterStatus').value;
            const searchVal = document.getElementById('searchId').value.toLowerCase();

            document.querySelectorAll('.rack').forEach(rack => {
                const rId = rack.className.match(/rack-node-(\d+)/)[1];
                const showRack = (rackVal === 'all' || rackVal === rId);
                rack.classList.toggle('hidden', !showRack);

                let rackCount = 0;
                if (showRack) {
                    rack.querySelectorAll('.shelf').forEach(shelf => {
                        let shelfCount = 0;
                        shelf.querySelectorAll('.box').forEach(box => {
                            const matchSearch = box.dataset.id.includes(searchVal);
                            const matchStatus = (statusVal === 'all' || box.dataset.estado === statusVal);
                            
                            if (matchStatus) {
                                box.style.display = "flex";
                                const isFound = searchVal === "" || matchSearch;
                                box.style.opacity = isFound ? "1" : "0.1";
                                if(isFound) { shelfCount++; rackCount++; }
                            } else { box.style.display = "none"; }
                        });
                        const sTitle = shelf.querySelector('.shelf-title');
                        sTitle.textContent = `${sTitle.dataset.base} (${shelfCount})`;
                    });
                }
                rack.querySelector('.rack-title').textContent = `ESTANTE ${rId} (${rackCount})`;
            });
        }

        function populateFilters() {
            const racks = [...new Set(inventoryData.map(i => i.bin.match(/\d+/)?.[0]))].filter(Boolean).sort((a,b)=>a-b);
            const statuses = [...new Set(inventoryData.map(i => i.estado))].filter(Boolean).sort();
            
            racks.forEach(r => {
                let opt = document.createElement('option'); opt.value = r; opt.textContent = `Estante ${r}`;
                document.getElementById('filterRack').appendChild(opt);
            });
            statuses.forEach(s => {
                let opt = document.createElement('option'); opt.value = s; opt.textContent = s;
                document.getElementById('filterStatus').appendChild(opt);
            });
        }

        init();
    </script>
</body>
</html>
