<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Z-Logistics Pro V4 - Slot Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --shelf-color: #1e272e;
            --box-size: 55px;
            --bg-a: #2196f3; --bg-b: #f44336; --bg-c: #4caf50; --bg-d: #ff9800;
            --bg-e: #9c27b0; --bg-f: #e91e63; --bg-g: #00bcd4; --bg-h: #607d8b;
            --check-color: #27ae60;
            --edit-accent: #f1c40f;
        }

        html, body { 
            height: 100%; margin: 0; padding: 0;
            background-color: #ffffff; 
            touch-action: pan-x pan-y;
            zoom: 1.1;
        }


        /* --- Ajuste para los números de Slot --- */
.slot::after {
    content: attr(data-slot-number);
    position: absolute; top: 2px; left: 3px;
    font-size: 8px; color: #bbb; font-weight: bold;
    pointer-events: none;
    display: none; /* Oculto por defecto */
}

/* Mostrar números SOLO en modo edición y SOLO si el slot está vacío */
body.edit-mode .slot:not(:has(.box))::after {
    display: block;
}

        /* --- ESTILOS MODO EDICIÓN --- */
        body:not(.edit-mode) .btn-transfer { display: none !important; }
        body:not(.edit-mode) .box { cursor: default !important; }
        body.edit-mode .rack { border: 2px solid var(--edit-accent); }
        
        #btnToggleEdit.active { background: var(--edit-accent); color: #000; }

        #controlPanel {
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 3000;
            transform: translateY(-100%); transition: transform 0.3s ease;
            padding: 15px; box-sizing: border-box;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        #controlPanel.active { transform: translateY(0); }

        .toggle-menu {
            position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; 
            background: #1e272e; color: white; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            z-index: 3001; cursor: pointer; font-size: 20px;
        }

        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; width: 100%; }
        button { background: #2d3436; color: white; border: none; font-weight: bold; cursor: pointer; }

        #warehouse { 
            display: flex; flex-direction: column; align-items: center;
            gap: 30px; padding: 80px 10px 40px 10px; 
        }

        .rack { 
            background: rgba(150, 150, 150, 0.137); border: 2px solid #cfcece; 
            border-radius: 10px; width: 100%; max-width: 300px; overflow: hidden;
            transition: border 0.3s;
        }

        .rack-title { background: var(--shelf-color); color: white; text-align: center; padding: 8px; font-weight: 800; font-size: 13px; }
        .shelf { display: flex; flex-direction: column-reverse; background: #f8fafc; border-bottom: 2px solid #cbd5e0; }

        .box-grid { 
            display: grid;
            grid-template-columns: repeat(5, var(--box-size));
            gap: 5px; padding: 2px; 
            justify-content: flex-start;
        }

        .shelf-title { 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 800;
            background: #2d3436; 
            color: rgb(255, 255, 255);
            border-left: 4px solid white;
        }

        .shelf-title span {
            grid-column: 2;
            padding: 2px 15px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .slot {
            width: var(--box-size); height: var(--box-size);
            background: rgba(150, 150, 150, 0.137); 
            border: 1px dashed rgba(211, 32, 32, 0.1);
            border-radius: 4px; 
            position: relative;
        }

        .slot::after {
            content: attr(data-slot-number);
            position: absolute; top: 2px; left: 3px;
            font-size: 8px; color: #bbb; font-weight: bold;
            pointer-events: none;
        }

        .slot:has(.box)::after { display: none; }

        .box { 
            width: 100%; height: 100%; border-radius: 4px; 
            background: linear-gradient(135deg, #707070 0%, #c9c9c9 100%);
            display: flex; align-items: center; justify-content: center; 
            position: relative; cursor: grab; touch-action: none; z-index: 10;
        }
        
        .box.is-checked { border: 2px solid var(--check-color); background: #e8f5e9; }
        .box-thumb { max-width: 85%; max-height: 85%; object-fit: contain; pointer-events: none; }
        .box-label { 
            position: absolute; top: 1px; right: 2px; z-index: 20;
            font-size: 9px; font-weight: 900; color: white; 
            background: rgba(0,0,0,0.6); padding: 0 2px; border-radius: 2px;
        }

        .box-talla {
            position: absolute; bottom: 2px; right: 3px; z-index: 25;
            font-family: 'Courier New', Courier, monospace; font-size: 9px;
            font-weight: bold; color: #ffffff;
            background: rgba(0,0,0,0.6); padding: 0 2px; border-radius: 2px;
            pointer-events: none;
        }

        .check-zone {
            position: absolute; bottom: 2px; left: 2px; width: 14px; height: 14px;
            background: white; border: 1px solid #ccc; border-radius: 50%;
            z-index: 50; cursor: pointer;
        }
        .box.is-checked .check-zone { background: var(--check-color); border-color: white; }

        .box::after {
            content: attr(data-title);
            position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: rgb(255, 255, 255); padding: 4px 8px;
            border-radius: 4px; font-size: 9px; white-space: nowrap;
            visibility: hidden; opacity: 0; transition: opacity 0.2s;
            z-index: 1000; pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
        }
        .box:hover::after, .box:active::after { visibility: visible; opacity: 2; }

        .shelf-node-A .shelf-title span { background-color: var(--bg-a); }
        .shelf-node-B .shelf-title span { background-color: var(--bg-b); }
        .shelf-node-C .shelf-title span { background-color: var(--bg-c); }
        .shelf-node-D .shelf-title span { background-color: var(--bg-d); }
        .shelf-node-E .shelf-title span { background-color: var(--bg-e); }
        .shelf-node-F .shelf-title span { background-color: var(--bg-f); }
        .shelf-node-G .shelf-title span { background-color: var(--bg-g); }
        .shelf-node-H .shelf-title span { background-color: var(--bg-h); }

        .btn-transfer { 
            grid-column: 3; justify-self: end;
            background: rgba(255,255,255,0.2); color: white; 
            border: 1px solid white; border-radius: 4px; 
            width: 22px; height: 22px; font-size: 10px; cursor: pointer; 
        }
        #sync-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #2d3436; color: white; padding: 10px 20px; border-radius: 50px;
            font-size: 13px; display: none; align-items: center; gap: 10px; z-index: 5000;
        }
        .spinner { width: 14px; height: 14px; border: 2px solid #555; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }


        /* --- MEJORAS VISUALES DE ARRASTRE --- */

/* La caja "fantasma" que se queda en el sitio original mientras arrastras */
.sortable-ghost {
    opacity: 0.4;
    background: #dfe6e9 !important;
    border: 2px dashed #636e72 !important;
}

/* La caja que llevas bajo el dedo/ratón */
.sortable-drag {
    opacity: 0.9;
    transform: rotate(5deg) scale(1.1); /* Efecto de que la estás levantando */
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    cursor: grabbing;
}

/* El slot que está a punto de recibir la caja */
.slot.sortable-chosen {
    background: rgba(46, 204, 113, 0.2);
    border: 2px solid var(--check-color);
}

/* Animación de éxito al soltar */
@keyframes dropSuccess {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); background-color: #27ae60; }
    100% { transform: scale(1); }
}

.drop-animate {
    animation: dropSuccess 0.4s ease-out;
}

/* Estilo para slots ocupados (opcional, visual) */
.slot:has(.box) {
    border: 1px solid rgba(0,0,0,0.05);
    background: white;
}



    </style>
</head>
<body onclick="initAudioContext()">

    <div class="toggle-menu" onclick="toggleMenu()">🛠️</div>

    <div id="controlPanel">
        <button id="btnToggleEdit" onclick="toggleEditMode()" style="grid-column: span 2;">🔒 Modo Lectura</button>
        <select id="filterRack" onchange="applyFilters()"><option value="all">Estantes</option></select>
        <select id="filterStatus" onchange="applyFilters()"><option value="all">Estados</option></select>
        <input type="text" id="searchId" placeholder="🔍 Buscar ID..." oninput="applyFilters()" style="grid-column: span 2;">
        <button onclick="location.reload()">🔄 Actualizar</button>
        <button style="background:#d63031;" onclick="clearChecks()">Limpiar ✓</button>
    </div>

    <div id="warehouse">Cargando almacén...</div>
    <div id="sync-toast"><div class="spinner"></div><span id="sync-text">Sincronizando...</span></div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQxmMtrLlKEH1uQUNmUvQxXUmFJQNQc46rwfOpKMNzJytrGDRxyMjo_S2DhQIDJmXTv1o6G2fvZQZgi/pub?gid=1046628345&single=true&output=csv';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxerk9BaSwQYzK8qFrv-uobpmash0q6ODL33qtZHt7KGk6f_CQzHk73pkLTmoxabr5C/exec';
        
        let inventoryData = [];
        let audioCtx = null;
        const SLOTS_PER_SHELF = 30; 
        let positionMap = JSON.parse(localStorage.getItem('z_logistics_positions')) || {};
        let isEditMode = false;
        let sortableInstances = [];

        function initAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playBeep(freq, vol, dur) {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = freq; g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            o.start(); o.stop(audioCtx.currentTime + dur);
        }

        function savePosition(boxId, slotId) {
            positionMap[boxId] = slotId;
            localStorage.setItem('z_logistics_positions', JSON.stringify(positionMap));
        }

        function toggleMenu() { document.getElementById('controlPanel').classList.toggle('active'); }

        // --- FUNCIÓN PARA CAMBIAR MODO ---
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btnToggleEdit');
            
            if (isEditMode) {
                document.body.classList.add('edit-mode');
                btn.classList.add('active');
                btn.innerHTML = '🔓 Modo Edición (Activo)';
                playBeep(800, 0.1, 0.2);
            } else {
                document.body.classList.remove('edit-mode');
                btn.classList.remove('active');
                btn.innerHTML = '🔒 Modo Lectura';
                playBeep(400, 0.1, 0.2);
            }

            // Actualizar instancias de Sortable
            sortableInstances.forEach(s => s.option('disabled', !isEditMode));
        }

        async function init() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.replace(/'/g, "").split(/\r?\n/).filter(r => r.trim() !== "");
                const sep = rows[0].includes(';') ? ';' : ',';

                inventoryData = rows.slice(1).map(row => {
                    const c = row.split(sep).map(cell => cell.trim());
                    const item = { 
                        id: c[1] || "S/N", codigo: c[2] || "N/A", estado: c[3] || "N/A", 
                        bin: (c[4] || "").toUpperCase(), costo: c[9] || "0", precio: c[10] || "0", img: c[13] || "" ,
                        talla: c[8] || "N/A",
                        orden: c[32] || "" 
                    };
                    if (item.orden && item.orden.includes('-')) {
                        positionMap[item.id] = item.orden;
                    }
                    return item;
                }).filter(i => i.bin !== "");

                localStorage.setItem('z_logistics_positions', JSON.stringify(positionMap));

                populateFilters();
                render();
            } catch (e) { console.error(e); }
        }

        function render() {
            const container = document.getElementById('warehouse');
            container.innerHTML = '';
            positionMap = JSON.parse(localStorage.getItem('z_logistics_positions')) || {};

            const rackNums = [...new Set(inventoryData.map(i => i.bin.match(/\d+/)?.[0]))].filter(Boolean).sort((a,b)=>a-b);
            const shelfLetters = ['H', 'G', 'F', 'E', 'D', 'C', 'B', 'A']; 

            rackNums.forEach(r => {
                const rackEl = document.createElement('div');
                rackEl.className = 'rack';
                rackEl.dataset.rackId = r;
                rackEl.innerHTML = `<div class="rack-title" data-base="ESTANTE ${r}">ESTANTE ${r}</div>`;

                shelfLetters.forEach(s => {
                    const shelfId = `${r}${s}`;
                    let shelfItems = inventoryData.filter(i => i.bin === shelfId);

                    const shelfEl = document.createElement('div');
                    shelfEl.className = `shelf shelf-node-${s}`;

                    const gridEl = document.createElement('div');
                    gridEl.className = "box-grid";

                    for (let i = 1; i <= SLOTS_PER_SHELF; i++) {
                        const exactAddress = `${shelfId}-${i}`;
                        const slot = document.createElement('div');
                        slot.className = 'slot';
                        slot.dataset.address = exactAddress;
                        slot.dataset.targetShelf = shelfId;
                        slot.setAttribute('data-slot-number', i);

                        let itemToPlace = shelfItems.find(item => positionMap[item.id] === exactAddress);

                        if (!itemToPlace) {
                            itemToPlace = shelfItems.find(item => !positionMap[item.id] || !positionMap[item.id].startsWith(shelfId));
                            if (itemToPlace) {
                                savePosition(itemToPlace.id, exactAddress);
                            }
                        }

                        if (itemToPlace) {
                            const box = createBoxElement(itemToPlace);
                            slot.appendChild(box);
                            shelfItems = shelfItems.filter(item => item.id !== itemToPlace.id);
                        }
                        gridEl.appendChild(slot);
                    }

                    const shelfTitle = document.createElement('div');
                    shelfTitle.className = 'shelf-title';
                    shelfTitle.dataset.base = shelfId;

                    const currentCount = inventoryData.filter(i => i.bin === shelfId).length;
                    shelfTitle.innerHTML = `
                        <span class="title-text">Repisa ${s} (${currentCount})</span>
                        <button class="btn-transfer" onclick="transferBox('${shelfId}')">🚚</button>
                    `;

                    shelfEl.appendChild(shelfTitle);
                    shelfEl.appendChild(gridEl);
                    rackEl.appendChild(shelfEl);
                });
                container.appendChild(rackEl);
            });
            initSortable();
            applyFilters();
        }

        function createBoxElement(item) {
            const box = document.createElement('div');
            box.className = 'box';
            box.dataset.unique = item.id;
            box.dataset.search = `${item.id} ${item.codigo}`.toLowerCase();
            box.dataset.estado = item.estado;
            box.setAttribute('data-title', `${item.codigo}`);
            
            box.innerHTML = `
                <div class="box-label">${item.id}</div>
                <div class="box-talla">${item.talla || ''}</div>
                <div class="check-zone"></div>
                ${item.img ? `<img src="${item.img}" class="box-thumb">` : '📦'}
            `;

            box.querySelector('.check-zone').onclick = (e) => {
                e.stopPropagation();
                box.classList.toggle('is-checked');
                playBeep(box.classList.contains('is-checked') ? 900 : 500, 0.1, 0.1);
            };
            return box;
        }

       function initSortable() {
    sortableInstances.forEach(s => s.destroy());
    sortableInstances = [];

    document.querySelectorAll('.slot').forEach(slot => {
        const s = new Sortable(slot, {
            // CONFIGURACIÓN DE GRUPO INTELIGENTE
            group: {
                name: 'shared',
                // Solo permite soltar si el slot está vacío (evita el desplazamiento)
                put: function (to) {
                    return to.el.children.length < 1;
                }
            },
            sort: false,      // <--- CRUCIAL: Evita que las cajas se desplacen al pasar por encima
            animation: 250,
            easing: "cubic-bezier(1, 0, 0, 1)",
            disabled: !isEditMode,
            
            // Clases visuales (manteniendo las mejoras anteriores)
            ghostClass: "sortable-ghost",
            chosenClass: "sortable-chosen",
            dragClass: "sortable-drag",
            
            onAdd: async function (evt) {
                const boxId = evt.item.dataset.unique;
                const oldBin = evt.from.dataset.targetShelf;
                const newBin = evt.to.dataset.targetShelf;
                const newSlotAddress = evt.to.dataset.address;

                // Seguridad extra entre repisas
                if (oldBin !== newBin) {
                    if (!confirm(`⚠️ ¿Mover ID ${boxId} a la repisa ${newBin}?`)) {
                        evt.from.appendChild(evt.item);
                        return;
                    }
                }

                // Animación de éxito
                evt.item.classList.add('drop-animate');
                setTimeout(() => evt.item.classList.remove('drop-animate'), 400);

                // Guardado lógico
                savePosition(boxId, newSlotAddress);
                showToast(`Ubicación: ${newSlotAddress}`);
                
                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify({ 
                            id: boxId, 
                            newBin: newBin,
                            newOrder: newSlotAddress 
                        })
                    });
                    const item = inventoryData.find(i => i.id === boxId);
                    if (item) { item.bin = newBin; item.orden = newSlotAddress; }
                    setTimeout(hideToast, 800);
                } catch (e) {
                    alert("Error de conexión al servidor");
                }
            }
        });
        sortableInstances.push(s);
    });
}

        function applyFilters() {
            const rV = document.getElementById('filterRack').value;
            const stV = document.getElementById('filterStatus').value;
            const search = document.getElementById('searchId').value.toLowerCase();

            document.querySelectorAll('.rack').forEach(rack => {
                const rId = rack.dataset.rackId;
                const showR = (rV === 'all' || rV === rId);
                let rCount = 0;

                rack.querySelectorAll('.shelf').forEach(shelf => {
                    let sCount = 0;
                    shelf.querySelectorAll('.slot').forEach(slot => {
                        const box = slot.querySelector('.box');
                        if (!box) {
                            slot.style.display = (search !== "") ? "none" : "block";
                            return;
                        }
                        const mS = box.dataset.search.includes(search);
                        const mSt = (stV === 'all' || box.dataset.estado === stV);
                        if (mSt && showR && (search === "" || mS)) {
                            slot.style.display = "block";
                            box.style.opacity = "1";
                            sCount++; rCount++;
                        } else {
                            slot.style.display = "none";
                        }
                    });
                    const txtSpan = shelf.querySelector('.title-text');
                    if (txtSpan) txtSpan.textContent = `${shelf.querySelector('.shelf-title').dataset.base} (${sCount})`;
                    shelf.classList.toggle('hidden', sCount === 0 && search !== "");
                });

                const rT = rack.querySelector('.rack-title');
                rT.textContent = `${rT.dataset.base} (${rCount})`;
                rack.classList.toggle('hidden', !showR || (rCount === 0 && search !== ""));
            });
        }

        async function transferBox(targetBin) {
            if (!isEditMode) return; // Doble seguridad

            const boxId = prompt(`Mover caja a la repisa ${targetBin}\nIngrese ID de la caja:`);
            if (!boxId) return;

            const item = inventoryData.find(i => i.id.toString().trim() === boxId.trim());
            if (!item) { alert("ID no encontrado"); return; }
            
            showToast("Buscando slot vacío...");
            const occupiedSlots = Object.values(positionMap);
            let firstFreeSlot = null;

            for (let i = 1; i <= SLOTS_PER_SHELF; i++) {
                const potentialAddress = `${targetBin}-${i}`;
                if (!occupiedSlots.includes(potentialAddress)) {
                    firstFreeSlot = potentialAddress;
                    break;
                }
            }

            if (!firstFreeSlot) { alert("❌ Repisa llena."); hideToast(); return; }

            try {
                delete positionMap[item.id];
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ id: item.id, newBin: targetBin, newOrder: firstFreeSlot })
                });
                savePosition(item.id, firstFreeSlot);
                item.bin = targetBin;
                item.orden = firstFreeSlot;
                render(); 
                showToast(`¡Movido a ${firstFreeSlot}!`);
                setTimeout(hideToast, 1000);
            } catch (e) {
                alert("Error al transferir");
                hideToast();
            }
        }

        function populateFilters() {
            const rackSelect = document.getElementById('filterRack');
            const statusSelect = document.getElementById('filterStatus');
            const rs = [...new Set(inventoryData.map(i => i.bin.match(/\d+/)?.[0]))].filter(Boolean).sort((a,b)=>a-b);
            const sts = [...new Set(inventoryData.map(i => i.estado))].filter(Boolean).sort();
            rs.forEach(r => rackSelect.innerHTML += `<option value="${r}">Estante ${r}</option>`);
            sts.forEach(s => statusSelect.innerHTML += `<option value="${s}">${s}</option>`);
            if (sts.includes("Disponible")) statusSelect.value = "Disponible";
        }

        function clearChecks() { if(confirm("¿Limpiar marcados?")) document.querySelectorAll('.box.is-checked').forEach(b => b.classList.remove('is-checked')); }
        function showToast(txt) { const t = document.getElementById('sync-toast'); t.style.display = 'flex'; document.getElementById('sync-text').textContent = txt; }
        function hideToast() { document.getElementById('sync-toast').style.display = 'none'; }

        init();
    </script>
</body>
</html>
